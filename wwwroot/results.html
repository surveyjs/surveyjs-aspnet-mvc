<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survey Results - SurveyJS + ASP.NET Core</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" />
    <!-- Tabulator is not included in the SurveyJS.Analytics package -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/css/tabulator.min.css" />
    <link rel="stylesheet" href="_content/SurveyJS.Analytics/survey.analytics.tabulator.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div class="sjs-app">
        <header class="sjs-app__header">
            <div class="sjs-app__header-inner">
                <a href="https://surveyjs.io/" class="sjs-app__logo-link" target="_blank" rel="noopener noreferrer">
                    <img src="images/logo.svg" class="sjs-app__logo" alt="SurveyJS Logo" />
                </a>
                <nav><a class="sjs-nav-button" href="./">My Surveys</a></nav>
            </div>
        </header>
        <main class="sjs-app__content">
            <h1 id="surveyName">Loading...</h1>
            <div id="resultsContainer"></div>
        </main>
        <footer class="sjs-app__footer">
            <div class="sjs-app__footer-inner">Copyright © Devsoft Baltic OÜ. All rights reserved.</div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
    <script src="_content/SurveyJS.Core/survey.core.min.js"></script>
    <script src="_content/SurveyJS.Analytics/survey.analytics.tabulator.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
